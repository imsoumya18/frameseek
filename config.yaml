# Which models frameseek uses and where they run.
# Change a line here to swap a model; no code changes needed.

data_dir: data            # per-video cache lives in data/<video_id>/

vision:
  backend: ollama
  model: qwen3-vl:8b-instruct
  host: http://localhost:11434
  max_image_side: 1024    # frames are downscaled to this before sending
  timeout_s: 180
  keep_alive: 30m         # how long Ollama keeps the model in memory after a call
  num_ctx: 8192           # context window in tokens. Ollama's default (4096) overflows with 3 frames
                          # (~3,700 tokens) plus captions and Bengali lyrics. Costs ~0.6 GB more memory on the 8B

device: auto              # auto | cuda | mps | cpu (for in-process models)

ingest:
  max_height: 720         # download cap; the vision model never sees more than ~1024px

shots:
  adaptive_threshold: 3.0 # cut if a frame changes this many times more than its neighbours
  min_content_val: 15.0   # ...and its raw change score is at least this
  min_shot_s: 0.6         # no new cut within this many seconds of the last (stops flashes)
  every_s: 10.0           # long shots get an extra keyframe every ~10 s

transcribe:
  source: auto            # auto = YouTube captions if any, else Whisper | youtube | whisper
  whisper_model: large-v3-turbo  # Bengali in Bengali script; ~same CPU speed as small. small = quick tests
  language_model: small   # detects the language first; turbo's small decoder misidentifies it
  vad: true               # only transcribe stretches with speech (stops hallucinations on music)
  beam_size: 5            # 1 = greedy and faster; 5 = beam search, more accurate
  language: ""            # force a language, e.g. "bn"; empty = detect
  device: auto            # auto (CUDA, else CPU) | cpu | cuda | mps (experimental in CTranslate2)

caption:
  model: qwen3-vl:4b-instruct   # ~1.9x faster than the 8B per frame, same summary on our test frame; empty = vision.model
  max_image_side: 1024    # Ollama resizes every image to its own size: smaller saves nothing, loses detail
  num_predict: 300        # hard cap on output tokens per frame

embed:
  text_model: intfloat/multilingual-e5-small      # questions vs captions and speech; e5-base tested: no better
  image_model: google/siglip2-base-patch16-224    # questions vs frame pixels (multilingual)
  speech_chunk_s: 15.0    # transcript lines merged into ~15 s chunks before embedding
  batch_size: 16

answer:
  model: ""               # answering model; empty = vision.model (8B). The 4B is ~2x faster, weaker judge
  mode: look              # look: check moments one at a time, zoom into the first hit (Section 8)
                          # compare: show the top_n frames together in one call (Section 7)
  top_n: 3                # compare mode: moments shown together (~1,240 input tokens per frame)
  look_n: 6               # look mode: most moments checked before answering "not found"
  zoom_margin: 0.3        # look mode: margin around the model's box, as a fraction of its size per side
  zoom_min_px: 160        # look mode: smallest crop side in original pixels (smaller is mostly blur)
  zoom_skip_area: 0.5     # look mode: a box covering more than this share of the frame isn't zoomed
  num_predict: 300
