[project]
name = "frameseek"
version = "0.1.0"
description = "Ask questions about anything in a video, said or shown, with evidence frames."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "av>=11,<19",                # faster-whisper 1.2 breaks on PyAV 19 (removed metadata_errors)
    "faster-whisper>=1.1",
    "gradio>=5.0",
    "httpx>=0.27",
    "lancedb>=0.20",
    "pillow>=10.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scenedetect>=0.7",          # brings opencv-python with it
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2",        # SigLIP2's multilingual tokenizer
    "torch>=2.3",
    "transformers>=4.49",        # first release with SigLIP2
    "typer>=0.12",
    "yt-dlp>=2025.1.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
frameseek = "frameseek.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frameseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
